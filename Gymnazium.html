    explanation:T(`Postup: ${name} má ${shape.steny} stěn, ${shape.hrany} hran a ${shape.vrcholy} vrcholů. Hledaná hodnota (${labelMap[vlastnost]}) je ${shape[vlastnost]}.`,
                  `Бодолт: ${name} нь ${shape.steny} нүүр, ${shape.hrany} ирмэг, ${shape.vrcholy} оройтой. Хайж буй утга (${labelMap[vlastnost]}) нь ${shape[vlastnost]}.`)};
}
function genObjemKrychle(level){
  const a=randInt(2, level===1?8:15);
  const v=a*a*a;
  return {topic:'krychle-kvadr',type:'objem-krychle',question:T(`Vypočítej objem krychle se stranou a = ${a} cm.`,`a = ${a} см талтай кубын эзэлхүүнийг бод.`),answer:String(v),
    explanation:T(`Postup: V = a × a × a = ${a} × ${a} × ${a} = ${v} cm³.`,`Бодолт: V = a × a × a = ${a} × ${a} × ${a} = ${v} см³.`)};
}
function genObjemKvadr(level){
  const a=randInt(2, level===1?8:12), b=randInt(2, level===1?8:12), c=randInt(2, level===1?8:12);
  const v=a*b*c;
  return {topic:'krychle-kvadr',type:'objem-kvadr',question:T(`Vypočítej objem kvádru s rozměry a = ${a} cm, b = ${b} cm, c = ${c} cm.`,`a = ${a} см, b = ${b} см, c = ${c} см хэмжээтэй тэгш өнцөгт хайрцгийн эзэлхүүнийг бод.`),answer:String(v),
    explanation:T(`Postup: V = a × b × c = ${a} × ${b} × ${c} = ${v} cm³.`,`Бодолт: V = a × b × c = ${a} × ${b} × ${c} = ${v} см³.`)};
}
function generateKrychleKvadr(level){
  return pick([genTelesaPocty,genObjemKrychle,genObjemKvadr])(level);
}


/* ================= GYMNÁZIUM – MATEMATIKA / ГИМНАЗИ – МАТЕМАТИК ================= */
function lcm(a,b){return a/gcd(a,b)*b;}
function isPrime(n){if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function dec(n){return String(n).replace('.',',');}
function mk(topic,type,question,answer,explanation,choices){const o={topic,type,question,answer:String(answer),explanation};if(choices)o.choices=choices;return o;}
function divisorsOf(n){const d=[];for(let i=1;i<=n;i++)if(n%i===0)d.push(i);return d;}
function mkChoices(correct,pool,n){const wrong=shuffleArr(pool.filter(x=>x!==correct)).slice(0,n-1);return shuffleArr([correct,...wrong]);}

// --- Pořadí operací / Үйлдлийн дараалал ---
function genPriorita(level){
  const pool = level===1?['a','b','c']:level===2?['d','e','f','g']:['h','i','j','k'];
  const hint=T('Pořadí: závorky → násobení a dělení (zleva) → sčítání a odčítání.','Дараалал: хаалт → үржих, хуваах (зүүнээс) → нэмэх, хасах.');
  for(let guard=0;guard<100;guard++){
    const v=pick(pool); let expr,val,steps;
    if(v==='a'){const a=randInt(2,30),b=randInt(2,9),c=randInt(2,9);expr=`${a} + ${b} × ${c}`;val=a+b*c;steps=`${b} × ${c} = ${b*c}; ${a} + ${b*c} = ${val}`;}
    else if(v==='b'){const a=randInt(3,12),b=randInt(3,12),c=randInt(1,a*b-1);expr=`${a} × ${b} − ${c}`;val=a*b-c;steps=`${a} × ${b} = ${a*b}; ${a*b} − ${c} = ${val}`;}
    else if(v==='c'){const d=randInt(2,9),q=randInt(2,12),c=randInt(2,30);expr=`${d*q} : ${d} + ${c}`;val=q+c;steps=`${d*q} : ${d} = ${q}; ${q} + ${c} = ${val}`;}
    else if(v==='d'){const a=randInt(2,20),b=randInt(2,20),c=randInt(2,9);expr=`(${a} + ${b}) × ${c}`;val=(a+b)*c;steps=`${a} + ${b} = ${a+b}; ${a+b} × ${c} = ${val}`;}
    else if(v==='e'){const a=randInt(2,12),b=randInt(2,12),c=randInt(2,12),d=randInt(2,12);expr=`${a} × ${b} + ${c} × ${d}`;val=a*b+c*d;steps=`${a} × ${b} = ${a*b}; ${c} × ${d} = ${c*d}; ${a*b} + ${c*d} = ${val}`;}
    else if(v==='f'){const d=randInt(2,9),q=randInt(2,15),y=randInt(5,60),z=randInt(2,30);expr=`(${y+d*q} − ${y}) : ${d} + ${z}`;val=q+z;steps=`${y+d*q} − ${y} = ${d*q}; ${d*q} : ${d} = ${q}; ${q} + ${z} = ${val}`;}
    else if(v==='g'){const a=randInt(5,40),b=randInt(3,12),c=randInt(3,12),d=randInt(1,a+b*c-1);expr=`${a} + ${b} × ${c} − ${d}`;val=a+b*c-d;steps=`${b} × ${c} = ${b*c}; ${a} + ${b*c} = ${a+b*c}; ${a+b*c} − ${d} = ${val}`;}
    else if(v==='h'){const a=randInt(2,20),b=randInt(2,20),d=randInt(2,15),c=d+randInt(2,15);expr=`(${a} + ${b}) × (${c} − ${d})`;val=(a+b)*(c-d);steps=`${a} + ${b} = ${a+b}; ${c} − ${d} = ${c-d}; ${a+b} × ${c-d} = ${val}`;}
    else if(v==='i'){const a=randInt(2,12),b=randInt(2,15),c=randInt(2,15),d=randInt(2,9),e=randInt(2,9);expr=`${a} × (${b} + ${c}) − ${d} × ${e}`;val=a*(b+c)-d*e;if(val<=0)continue;steps=`${b} + ${c} = ${b+c}; ${a} × ${b+c} = ${a*(b+c)}; ${d} × ${e} = ${d*e}; ${a*(b+c)} − ${d*e} = ${val}`;}
    else if(v==='j'){const d=randInt(2,9),q=randInt(2,12),z=randInt(2,20),w=randInt(2,9);expr=`(${d*q} : ${d} + ${z}) × ${w}`;val=(q+z)*w;steps=`${d*q} : ${d} = ${q}; ${q} + ${z} = ${q+z}; ${q+z} × ${w} = ${val}`;}
    else {const b=randInt(5,20),c=randInt(1,b-1),d=randInt(2,9),a=(b-c)*d+randInt(1,40);expr=`${a} − (${b} − ${c}) × ${d}`;val=a-(b-c)*d;steps=`${b} − ${c} = ${b-c}; ${b-c} × ${d} = ${(b-c)*d}; ${a} − ${(b-c)*d} = ${val}`;}
    if(!(val>0&&Number.isInteger(val)))continue;
    return mk('gym-priorita','priorita',T(`Vypočítej: ${expr}`,`Бод: ${expr}`),val,`${hint} ${steps}.`);
  }
}

// --- Dělitelnost / Хуваагдах чанар ---
const ZNAKY={
  2:{cs:'poslední číslice je sudá',mn:'сүүлийн цифр нь тэгш'},
  3:{cs:'ciferný součet je dělitelný třemi',mn:'цифрүүдийн нийлбэр 3-т хуваагдана'},
  4:{cs:'poslední dvojčíslí je dělitelné čtyřmi',mn:'сүүлийн хоёр цифрээс үүссэн тоо 4-д хуваагдана'},
  5:{cs:'číslo končí 0 nebo 5',mn:'0 эсвэл 5-аар төгснө'},
  6:{cs:'číslo je dělitelné 2 i 3',mn:'2 болон 3 хоёуланд хуваагдана'},
  8:{cs:'poslední trojčíslí je dělitelné osmi',mn:'сүүлийн гурван цифрээс үүссэн тоо 8-д хуваагдана'},
  9:{cs:'ciferný součet je dělitelný devíti',mn:'цифрүүдийн нийлбэр 9-д хуваагдана'},
  10:{cs:'číslo končí nulou',mn:'0-ээр төгснө'},
  12:{cs:'číslo je dělitelné 3 i 4',mn:'3 болон 4 хоёуланд хуваагдана'}
};
function genDelitelnost(level){
  const variants = level===1?['nsd','prvocislo','znak']:level===2?['nsd','nsn','prvocislo','znak','pocet']:['nsd','nsn','znak','pocet','pocetPrv','cislice'];
  const v=pick(variants);
  if(v==='nsd'){
    const g=randInt(2, level===1?6:level===2?9:14); let m,n;
    do{m=randInt(2,level===3?15:9);n=randInt(2,level===3?15:9);}while(m===n||gcd(m,n)!==1);
    const a=g*m,b=g*n;
    return mk('gym-delitelnost','nsd',T(`Najdi největší společný dělitel čísel ${a} a ${b}.`,`${a} ба ${b} тооны хамгийн их ерөнхий хуваагчийг (ХИЕХ) ол.`),g,
      T(`${a} = ${g} × ${m}, ${b} = ${g} × ${n}; čísla ${m} a ${n} už nemají společného dělitele, proto NSD = ${g}.`,`${a} = ${g} × ${m}, ${b} = ${g} × ${n}; ${m} ба ${n}-д ерөнхий хуваагч байхгүй тул ХИЕХ = ${g}.`));
  }
  if(v==='nsn'){
    let a,b; do{a=randInt(3,level===2?10:15);b=randInt(3,level===2?10:15);}while(a===b);
    const l=lcm(a,b),g=gcd(a,b);
    return mk('gym-delitelnost','nsn',T(`Najdi nejmenší společný násobek čísel ${a} a ${b}.`,`${a} ба ${b} тооны хамгийн бага ерөнхий үржвэрийг (ХБЕҮ) ол.`),l,
      T(`NSN = ${a} × ${b} : NSD = ${a*b} : ${g} = ${l}.`,`ХБЕҮ = ${a} × ${b} : ХИЕХ = ${a*b} : ${g} = ${l}.`));
  }
  if(v==='prvocislo'){
    const wantPrime=Math.random()<0.5; let n;
    do{n=randInt(level===1?10:20,level===1?50:100);}while(isPrime(n)!==wantPrime);
    let d=2; while(n%d!==0&&d*d<=n)d++;
    const ex=wantPrime?T(`${n} je dělitelné jen čísly 1 a ${n}, je to prvočíslo.`,`${n} зөвхөн 1 ба ${n}-д хуваагдана, тиймээс анхны тоо.`)
                      :T(`${n} = ${d} × ${n/d}, má tedy další dělitele – není to prvočíslo.`,`${n} = ${d} × ${n/d}, өөр хуваагчтай тул анхны тоо биш.`);
    return mk('gym-delitelnost','prvocislo',T(`Je číslo ${n} prvočíslo?`,`${n} нь анхны тоо мөн үү?`),wantPrime?T('ano','Тийм'):T('ne','Үгүй'),ex,T(['ano','ne'],['Тийм','Үгүй']));
  }
  if(v==='znak'){
    const ks = level===1?[2,3,5,10]:level===2?[3,4,5,6,9]:[4,6,8,9,12];
    const k=pick(ks), digits=level===1?3:level===2?4:5;
    const lo=Math.ceil(Math.pow(10,digits-1)/k), hi=Math.floor((Math.pow(10,digits)-1)/k);
    const good=k*randInt(lo,hi); const bad=new Set(); let g2=0;
    while(bad.size<3&&g2<500){g2++;const c=good+randInt(-15,15);if(c<Math.pow(10,digits-1)||c>=Math.pow(10,digits))continue;if(c%k!==0)bad.add(c);}
    while(bad.size<3){const c=randInt(Math.pow(10,digits-1),Math.pow(10,digits)-1);if(c%k!==0)bad.add(c);}
    const choices=shuffleArr([good,...bad]).map(String);
    return mk('gym-delitelnost','znak',T(`Které z čísel je dělitelné číslem ${k}?`,`Аль тоо ${k}-д хуваагдах вэ?`),good,
      T(`Číslo dělitelné ${k}: ${ZNAKY[k].cs}. ${good} = ${k} × ${good/k}.`,`${k}-д хуваагдах тоо: ${ZNAKY[k].mn}. ${good} = ${k} × ${good/k}.`),choices);
  }
  if(v==='pocet'){
    const list=level===2?[12,16,18,20,24,28,30,36]:[48,60,72,80,90,96,100,120];
    const n=pick(list),d=divisorsOf(n);
    return mk('gym-delitelnost','pocet',T(`Kolik dělitelů má číslo ${n}? (včetně 1 a ${n})`,`${n} тоо хэдэн хуваагчтай вэ? (1 ба ${n}-г оруулан)`),d.length,
      T(`Dělitelé: ${d.join(', ')} → celkem ${d.length}.`,`Хуваагчид: ${d.join(', ')} → нийт ${d.length}.`));
  }
  if(v==='pocetPrv'){
    const s=randInt(1,70),e=s+randInt(15,30);const pr=[];for(let i=s;i<=e;i++)if(isPrime(i))pr.push(i);
    return mk('gym-delitelnost','pocetPrv',T(`Kolik prvočísel leží mezi čísly ${s} a ${e} (včetně krajních čísel)?`,`${s}-аас ${e} хүртэл (хоёр захын тоог оруулан) хэдэн анхны тоо байна вэ?`),pr.length,
      T(`Prvočísla: ${pr.join(', ')||'žádné'} → ${pr.length}.`,`Анхны тоонууд: ${pr.join(', ')||'алга'} → ${pr.length}.`));
  }
  let k,p,s; do{k=pick([3,9]);p=randInt(10,9999);s=String(p).split('').reduce((x,y)=>x+Number(y),0);}while(s%k===0);
  let d=0; while((s+d)%k!==0)d++;
  return mk('gym-delitelnost','cislice',T(`Jaká nejmenší číslice musí být místo hvězdičky, aby číslo ${p}* bylo dělitelné ${k}?`,`Од (*)-ны оронд хамгийн багадаа ямар цифр бичвэл ${p}* тоо ${k}-д хуваагдах вэ?`),d,
    T(`Ciferný součet čísla ${p} je ${s}. Aby součet byl dělitelný ${k}, přidáme ${d}: ${s} + ${d} = ${s+d}.`,`${p} тооны цифрүүдийн нийлбэр ${s}. ${k}-д хуваагдахын тулд ${d}-г нэмнэ: ${s} + ${d} = ${s+d}.`));
}

// --- Rovnice / Тэгшитгэл ---
function genRovnice(level){
  const head=T('Řeš rovnici (najdi x): ','Тэгшитгэлийг бод (x-ийг ол): ');
  const how=T('Postup (opačné operace): ','Бодолт (урвуу үйлдлээр): ');
  const opts = level===1?[1,2,3,4,5]:level===2?[6,7,8,9,10]:[11,12,13,14];
  const t=pick(opts); let q,x,steps,word=null;
  if(t===1){const a=randInt(2,60);x=randInt(2,60);q=`x + ${a} = ${x+a}`;steps=`x = ${x+a} − ${a} = ${x}`;}
  else if(t===2){const a=randInt(2,50);x=randInt(a+1,a+50);q=`x − ${a} = ${x-a}`;steps=`x = ${x-a} + ${a} = ${x}`;}
  else if(t===3){const a=randInt(2,12);x=randInt(2,25);q=`${a} · x = ${a*x}`;steps=`x = ${a*x} : ${a} = ${x}`;}
  else if(t===4){const a=randInt(2,12),b=randInt(2,25);x=a*b;q=`x : ${a} = ${b}`;steps=`x = ${b} · ${a} = ${x}`;}
  else if(t===5){const b=randInt(2,40);x=randInt(2,40);const a=x+b;q=`${a} − x = ${b}`;steps=`x = ${a} − ${b} = ${x}`;}
  else if(t===6){const a=randInt(2,12),b=randInt(2,40);x=randInt(2,30);q=`${a} · x + ${b} = ${a*x+b}`;steps=`${a} · x = ${a*x+b} − ${b} = ${a*x}; x = ${a*x} : ${a} = ${x}`;}
  else if(t===7){const a=randInt(2,12),b=randInt(2,40);x=randInt(Math.floor(b/a)+2,Math.floor(b/a)+30);q=`${a} · x − ${b} = ${a*x-b}`;steps=`${a} · x = ${a*x-b} + ${b} = ${a*x}; x = ${a*x} : ${a} = ${x}`;}
  else if(t===8){const b=randInt(2,9),c=randInt(3,15),a=randInt(1,b*c-2);x=b*c-a;q=`(x + ${a}) : ${b} = ${c}`;steps=`x + ${a} = ${c} · ${b} = ${b*c}; x = ${b*c} − ${a} = ${x}`;}
  else if(t===9){const a=randInt(2,9),b=randInt(1,15);x=randInt(2,25);q=`${a} · (x + ${b}) = ${a*(x+b)}`;steps=`x + ${b} = ${a*(x+b)} : ${a} = ${x+b}; x = ${x+b} − ${b} = ${x}`;}
  else if(t===10){const a=randInt(2,9),b=randInt(2,40);x=randInt(Math.floor(b/a)+2,Math.floor(b/a)+25);const c=a*x-b;
    word=T(`Myslím si číslo. Když ho vynásobím ${a} a potom odečtu ${b}, dostanu ${c}. Které číslo si myslím?`,`Би нэг тоо бодсон. Түүнийг ${a}-аар үржүүлж, дараа нь ${b}-г хасахад ${c} гарна. Би ямар тоо бодсон бэ?`);
    steps=`${a} · x − ${b} = ${c}; ${a} · x = ${c} + ${b} = ${a*x}; x = ${a*x} : ${a} = ${x}`;}
  else if(t===11){const a=randInt(2,6),c=a+randInt(1,5);x=randInt(3,25);const b=randInt(1,(c-a)*x-1),d=(c-a)*x-b;q=`${a}·x + ${b} = ${c}·x − ${d}`;steps=`${c}x − ${a}x = ${b} + ${d}; ${c-a}·x = ${b+d}; x = ${b+d} : ${c-a} = ${x}`;}
  else if(t===12){const b=randInt(2,9),a=randInt(1,12);x=randInt(2,20);const inner=(x+a)*b,c=randInt(1,inner-1),d=inner-c;q=`(x + ${a}) · ${b} − ${c} = ${d}`;steps=`(x + ${a}) · ${b} = ${d} + ${c} = ${inner}; x + ${a} = ${inner} : ${b} = ${x+a}; x = ${x}`;}
  else if(t===13){x=randInt(5,60);const S=3*x+3;
    word=T(`Součet tří po sobě jdoucích přirozených čísel je ${S}. Které z nich je nejmenší?`,`Дараалсан гурван натурал тооны нийлбэр ${S}. Тэдний хамгийн бага нь аль вэ?`);
    steps=`x + (x+1) + (x+2) = 3x + 3 = ${S}; 3x = ${S-3}; x = ${x}`;}
  else {
    for(let i=0;i<5000;i++){const p=randInt(2,5),r=p+randInt(1,4),qq=randInt(1,9),s=randInt(1,9),num=p*qq+r*s;
      if(num%(r-p)===0&&num/(r-p)>s&&num/(r-p)<=40){x=num/(r-p);q=`${p} · (x + ${qq}) = ${r} · (x − ${s})`;steps=`${p}x + ${p*qq} = ${r}x − ${r*s}; ${r*s+p*qq} = ${r-p}·x; x = ${r*s+p*qq} : ${r-p} = ${x}`;break;}}
    if(x===undefined){x=7;q=`2 · (x + 3) = 3 · (x − 1)`;steps=`2x + 6 = 3x − 3; x = 9`;x=9;}
  }
  return mk('gym-rovnice','rovnice',word?word:head+q,x,how+steps+'.');
}

// --- Průměr / Дундаж ---
function genPrumer(level){
  const v=pick(level===1?['avg','missing']:level===2?['avg','missing','tests']:['missing','tests','groups','avg']);
  if(v==='avg'){
    const n=randInt(level===1?3:4, level===3?7:5), avg=randInt(10,90); let list;
    do{const dev=[];let sum=0;for(let i=0;i<n-1;i++){const d=randInt(-8,8);dev.push(d);sum+=d;}dev.push(-sum);list=dev.map(d=>avg+d);}while(list.some(x=>x<1));
    const s=list.reduce((a,b)=>a+b,0);
    return mk('gym-prumer','avg',T(`Jaký je průměr čísel ${list.join(', ')}?`,`${list.join(', ')} тоонуудын дундаж хэд вэ?`),avg,
      T(`Součet: ${list.join(' + ')} = ${s}; průměr = ${s} : ${n} = ${avg}.`,`Нийлбэр: ${list.join(' + ')} = ${s}; дундаж = ${s} : ${n} = ${avg}.`));
  }
  if(v==='missing'){
    const n=randInt(3,level===3?7:5), avg=randInt(10,80); let list;
    do{const dev=[];let sum=0;for(let i=0;i<n-1;i++){const d=randInt(-9,9);dev.push(d);sum+=d;}dev.push(-sum);list=dev.map(d=>avg+d);}while(list.some(x=>x<1));
    const missing=list[n-1], known=list.slice(0,n-1);
    return mk('gym-prumer','missing',T(`Průměr ${n} čísel je ${avg}. Prvních ${n-1} čísel je: ${known.join(', ')}. Jaké je poslední číslo?`,`${n} тооны дундаж ${avg}. Эхний ${n-1} тоо: ${known.join(', ')}. Сүүлийн тоо хэд вэ?`),missing,
      T(`Součet všech čísel = ${avg} × ${n} = ${avg*n}. Poslední = ${avg*n} − ${known.reduce((a,b)=>a+b,0)} = ${missing}.`,`Бүх тооны нийлбэр = ${avg} × ${n} = ${avg*n}. Сүүлийн тоо = ${avg*n} − ${known.reduce((a,b)=>a+b,0)} = ${missing}.`));
  }
  if(v==='tests'){
    const n=randInt(3,5), a=randInt(55,85), t=a+randInt(1,4), last=t+n*(t-a);
    if(last>100)return genPrumer(level);
    const j=jmeno();
    return mk('gym-prumer','tests',T(`${j} získal z ${n} testů v průměru ${a} bodů. Kolik bodů musí získat v dalším testu, aby měl průměr ${t} bodů?`,`${j} ${n} шалгалтад дунджаар ${a} оноо авсан. Дараагийн шалгалтад хэдэн оноо авбал дундаж нь ${t} болох вэ?`),last,
      T(`Potřebný součet: ${t} × ${n+1} = ${t*(n+1)}. Dosavadní součet: ${a} × ${n} = ${a*n}. Rozdíl: ${t*(n+1)} − ${a*n} = ${last}.`,`Хэрэгтэй нийлбэр: ${t} × ${n+1} = ${t*(n+1)}. Одоогийн нийлбэр: ${a} × ${n} = ${a*n}. Зөрүү: ${t*(n+1)} − ${a*n} = ${last}.`));
  }
  for(let i=0;i<5000;i++){
    const n1=randInt(8,20),n2=randInt(6,18),h1=randInt(138,150),h2=randInt(138,150);
    if((n1*h1+n2*h2)%(n1+n2)===0){const avg=(n1*h1+n2*h2)/(n1+n2);
      return mk('gym-prumer','groups',T(`Ve třídě je ${n1} dívek s průměrnou výškou ${h1} cm a ${n2} chlapců s průměrnou výškou ${h2} cm. Jaká je průměrná výška celé třídy (v cm)?`,`Ангид дундаж өндөр нь ${h1} см ${n1} охин, дундаж өндөр нь ${h2} см ${n2} хөвгүүн байна. Бүх ангийн дундаж өндөр хэд вэ (см-ээр)?`),avg,
        T(`Součet výšek: ${n1} × ${h1} + ${n2} × ${h2} = ${n1*h1+n2*h2}; počet dětí ${n1+n2}; průměr = ${avg}.`,`Өндрүүдийн нийлбэр: ${n1} × ${h1} + ${n2} × ${h2} = ${n1*h1+n2*h2}; хүүхдийн тоо ${n1+n2}; дундаж = ${avg}.`));}
  }
  return genPrumer(1);
}

// --- Procenta / Хувь ---
function genProcenta(level){
  const v=pick(level===1?['cast','cast','sleva']:level===2?['cast','sleva','jaka']:['cast','sleva','jaka','zpet','dvakrat']);
  if(v==='cast'){
    const ps=level===1?[10,20,25,50]:level===2?[5,15,30,40,60,75]:[8,12,35,45,120];
    const p=pick(ps),unit=100/gcd(p,100),base=unit*randInt(2,level===1?10:20),res=base*p/100;
    return mk('gym-procenta','cast',T(`Kolik je ${p} % z čísla ${base}?`,`${base}-ийн ${p} % нь хэд вэ?`),res,
      T(`1 % = ${base} : 100 = ${base/100}; ${p} % = ${p} × ${base/100} = ${res}.`,`1 % = ${base} : 100 = ${base/100}; ${p} % = ${p} × ${base/100} = ${res}.`));
  }
  if(v==='sleva'){
    const p=pick(level===1?[10,20,25,50]:[10,20,25,30,40,50]),unit=100/gcd(p,100),P=unit*randInt(3,25),disc=P*p/100;
    return mk('gym-procenta','sleva',T(`Zboží stálo ${mena(P)}. Zlevnilo o ${p} %. Kolik stojí po slevě?`,`Бараа ${mena(P)} байсан. ${p} %-иар хямдарлаа. Хямдралын дараа хэд болох вэ?`),P-disc,
      T(`Sleva: ${p} % z ${P} = ${disc}. Nová cena: ${P} − ${disc} = ${P-disc}.`,`Хямдрал: ${P}-ийн ${p} % = ${disc}. Шинэ үнэ: ${P} − ${disc} = ${P-disc}.`));
  }
  if(v==='jaka'){
    for(let i=0;i<1000;i++){const b=pick([20,25,40,50,80,100,200]),a=randInt(1,b-1);if((a*100)%b===0){const p=a*100/b;
      return mk('gym-procenta','jaka',T(`Kolik procent je ${a} z ${b}? (odpověď v %)`,`${a} нь ${b}-ийн хэдэн хувь вэ? (хариуг %-иар)`),p,
        T(`${a} : ${b} = ${a/b}; ${a/b} × 100 = ${p} %.`,`${a} : ${b} = ${a/b}; ${a/b} × 100 = ${p} %.`));}}
  }
  if(v==='zpet'){
    const p=pick([10,20,25,30,40,50]),unit=100/gcd(p,100),O=unit*randInt(3,20),F=O-O*p/100;
    return mk('gym-procenta','zpet',T(`Po slevě ${p} % stojí zboží ${mena(F)}. Kolik stálo před slevou?`,`${p} %-ийн хямдралын дараа бараа ${mena(F)} болсон. Хямдрахаас өмнө хэд байсан бэ?`),O,
      T(`Po slevě platíme ${100-p} % původní ceny. ${100-p} % = ${F}, 1 % = ${F/(100-p)}, 100 % = ${O}.`,`Хямдралын дараа анхны үнийн ${100-p} %-ийг төлнө. ${100-p} % = ${F}, 1 % = ${F/(100-p)}, 100 % = ${O}.`));
  }
  for(let i=0;i<2000;i++){
    const p1=pick([10,20,25,50]),p2=pick([10,20,25,50]),B=1000*randInt(1,5),res=B*(100+p1)*(100-p2)/10000;
    if(Number.isInteger(res)){const up=B*(100+p1)/100;
      return mk('gym-procenta','dvakrat',T(`Cena ${mena(B)} nejdřív vzrostla o ${p1} % a potom klesla o ${p2} %. Kolik stojí nakonec?`,`${mena(B)} үнэ эхлээд ${p1} %-иар өсөж, дараа нь ${p2} %-иар буурав. Эцэст нь хэд болох вэ?`),res,
        T(`Po zdražení: ${up}. ${p2} % z ${up} = ${up*p2/100}. Konečná cena: ${up} − ${up*p2/100} = ${res}.`,`Үнэ өссөний дараа: ${up}. ${up}-ийн ${p2} % = ${up*p2/100}. Эцсийн үнэ: ${up} − ${up*p2/100} = ${res}.`));}
  }
  return genProcenta(1);
}

// --- Rychlost, dráha, čas / Хурд, зам, хугацаа ---
function genRychlost(level){
  const v=pick(level===1?['dr','cas']:level===2?['dr','cas','min']:['potk','dohon','prum','min']);
  if(v==='dr'){const sp=randInt(20,90),t=randInt(2,6);
    return mk('gym-rychlost','dr',T(`Auto jede stálou rychlostí ${sp} km/h. Kolik km ujede za ${t} hodiny?`,`Машин ${sp} км/ц тогтмол хурдтай явна. ${t} цагт хэдэн км явах вэ?`),sp*t,T(`s = v · t = ${sp} · ${t} = ${sp*t} km.`,`s = v · t = ${sp} · ${t} = ${sp*t} км.`));}
  if(v==='cas'){const sp=randInt(20,80),t=randInt(2,7),s=sp*t;
    return mk('gym-rychlost','cas',T(`Vlak ujel ${s} km rychlostí ${sp} km/h. Kolik hodin jel?`,`Галт тэрэг ${sp} км/ц хурдтай ${s} км явсан. Хэдэн цаг явсан бэ?`),t,T(`t = s : v = ${s} : ${sp} = ${t} h.`,`t = s : v = ${s} : ${sp} = ${t} цаг.`));}
  if(v==='min'){
    for(let i=0;i<1000;i++){const sp=pick([12,15,18,20,24,30,36,40,45,60]),m=pick([10,15,20,30,40,45]),d=sp*m/60;
      if(Number.isInteger(d)){return mk('gym-rychlost','min',T(`Cyklista jede rychlostí ${sp} km/h. Kolik km ujede za ${m} minut?`,`Дугуйчин ${sp} км/ц хурдтай явна. ${m} минутад хэдэн км явах вэ?`),d,
        T(`${m} minut = ${m}/60 h. s = ${sp} · ${m}/60 = ${d} km.`,`${m} минут = ${m}/60 цаг. s = ${sp} · ${m}/60 = ${d} км.`));}}
  }
  if(v==='potk'){const v1=randInt(40,90),v2=randInt(40,90),t=randInt(2,5),D=(v1+v2)*t;
    return mk('gym-rychlost','potk',T(`Dvě města jsou od sebe vzdálena ${D} km. Z obou vyjedou současně proti sobě auta rychlostmi ${v1} km/h a ${v2} km/h. Za kolik hodin se potkají?`,`Хоёр хот хоорондоо ${D} км зайтай. Хоёулангаас нэгэн зэрэг эсрэг тийш ${v1} км/ц ба ${v2} км/ц хурдтай машин гарав. Хэдэн цагийн дараа тааралдах вэ?`),t,
      T(`Za 1 hodinu se přiblíží o ${v1} + ${v2} = ${v1+v2} km. Čas: ${D} : ${v1+v2} = ${t} h.`,`1 цагт ${v1} + ${v2} = ${v1+v2} км-ээр ойртоно. Хугацаа: ${D} : ${v1+v2} = ${t} цаг.`));}
  if(v==='dohon'){const t=pick([1,2,3]),h=pick([1,2,3]),k=randInt(3,9),v1=t*k,v2=v1+k*h,d=v1*h;
    return mk('gym-rychlost','dohon',T(`Chodec vyšel rychlostí ${v1} km/h. O ${h} h později za ním vyjel cyklista rychlostí ${v2} km/h. Za kolik hodin po svém výjezdu ho cyklista dožene?`,`Явган хүн ${v1} км/ц хурдтай гарсан. ${h} цагийн дараа түүний араас дугуйчин ${v2} км/ц хурдтай гарлаа. Дугуйчин гарснаас хойш хэдэн цагийн дараа түүнийг гүйцэх вэ?`),t,
      T(`Náskok chodce: ${v1} · ${h} = ${d} km. Cyklista se přibližuje o ${v2} − ${v1} = ${v2-v1} km/h. Čas: ${d} : ${v2-v1} = ${t} h.`,`Явган хүний тэргүүлсэн зай: ${v1} · ${h} = ${d} км. Дугуйчин цагт ${v2} − ${v1} = ${v2-v1} км-ээр ойртоно. Хугацаа: ${d} : ${v2-v1} = ${t} цаг.`));}
  const [a,b,r]=pick([[40,60,48],[30,60,40],[60,90,72],[20,30,24],[15,30,20],[10,15,12],[30,45,36],[20,60,30],[24,40,30],[12,36,18]]);
  return mk('gym-rychlost','prum',T(`Do kopce jela cyklistka rychlostí ${a} km/h a stejnou cestou zpět rychlostí ${b} km/h. Jaká byla její průměrná rychlost na celé cestě (v km/h)?`,`Дугуйчин өгөршиндөө ${a} км/ц, замаа буцахдаа ${b} км/ц хурдтай явав. Бүх замын дундаж хурд нь хэд вэ (км/ц)?`),r,
    T(`Vezmi dráhu ${a*b} km v každém směru: čas ${a*b}:${a} + ${a*b}:${b} = ${b} + ${a} = ${a+b} h, dráha ${2*a*b} km. Průměr: ${2*a*b} : ${a+b} = ${r} km/h.`,`Нэг чиглэлд ${a*b} км авъя: хугацаа ${a*b}:${a} + ${a*b}:${b} = ${b} + ${a} = ${a+b} цаг, зам ${2*a*b} км. Дундаж: ${2*a*b} : ${a+b} = ${r} км/ц.`));
}

// --- Geometrie (těžší) / Геометр (хүнд) ---
function genGeomGym(level){
  const v=pick(level===1?['obdSide','ctvObvod','pokryti']:level===2?['obdSide','ctvObvod','pokryti','lshape','krychleVS','kvadrHrana','ctvDouble']:['lshape','lshapeObv','painted','povrchKvadr','krychleVS','kvadrHrana','ctvDouble','painted']);
  if(v==='obdSide'){const a=randInt(3,20),b=randInt(3,20),S=a*b;
    return mk('gym-geometrie','obdSide',T(`Obdélník má obsah ${S} cm² a jednu stranu ${a} cm. Jaký je jeho obvod (v cm)?`,`Тэгш өнцөгтийн талбай ${S} см², нэг тал нь ${a} см. Түүний периметр хэд вэ (см)?`),2*(a+b),
      T(`Druhá strana: ${S} : ${a} = ${b} cm. Obvod: 2 · (${a} + ${b}) = ${2*(a+b)} cm.`,`Нөгөө тал: ${S} : ${a} = ${b} см. Периметр: 2 · (${a} + ${b}) = ${2*(a+b)} см.`));}
  if(v==='ctvObvod'){const a=randInt(3,25);
    return mk('gym-geometrie','ctvObvod',T(`Obvod čtverce je ${4*a} cm. Jaký je jeho obsah (v cm²)?`,`Дөрвөлжингийн периметр ${4*a} см. Түүний талбай хэд вэ (см²)?`),a*a,
      T(`Strana: ${4*a} : 4 = ${a} cm. Obsah: ${a} · ${a} = ${a*a} cm².`,`Тал: ${4*a} : 4 = ${a} см. Талбай: ${a} · ${a} = ${a*a} см².`));}
  if(v==='pokryti'){const s=pick([2,3,4,5]),a=s*randInt(3,8),b=s*randInt(3,8);
    return mk('gym-geometrie','pokryti',T(`Kolik čtverců o straně ${s} cm se vejde do obdélníku ${a} cm × ${b} cm?`,`${a} см × ${b} см тэгш өнцөгтөд ${s} см талтай хэдэн дөрвөлжин багтах вэ?`),(a/s)*(b/s),
      T(`Na délku ${a} : ${s} = ${a/s}, na šířku ${b} : ${s} = ${b/s}. Celkem ${a/s} · ${b/s} = ${(a/s)*(b/s)}.`,`Уртад нь ${a} : ${s} = ${a/s}, өргөнд нь ${b} : ${s} = ${b/s}. Нийт ${a/s} · ${b/s} = ${(a/s)*(b/s)}.`));}
  if(v==='lshape'||v==='lshapeObv'){const a=randInt(7,16),b=randInt(7,16),c=randInt(2,a-3),d=randInt(2,b-3);
    const intro=T(`Z rohu obdélníku ${a} cm × ${b} cm vystřihneme obdélník ${c} cm × ${d} cm.`,`${a} см × ${b} см тэгш өнцөгтийн булангаас ${c} см × ${d} см тэгш өнцөгт хайчилж авлаа.`);
    if(v==='lshape')return mk('gym-geometrie','lshape',intro+' '+T('Jaký je obsah zbylého útvaru (v cm²)?','Үлдсэн дүрсийн талбай хэд вэ (см²)?'),a*b-c*d,
      T(`${a} · ${b} − ${c} · ${d} = ${a*b} − ${c*d} = ${a*b-c*d} cm².`,`${a} · ${b} − ${c} · ${d} = ${a*b} − ${c*d} = ${a*b-c*d} см².`));
    return mk('gym-geometrie','lshapeObv',intro+' '+T('Jaký je obvod zbylého útvaru (v cm)?','Үлдсэн дүрсийн периметр хэд вэ (см)?'),2*(a+b),
      T(`Vystřižením z rohu se obvod nezmění: 2 · (${a} + ${b}) = ${2*(a+b)} cm.`,`Булангаас хайчлахад периметр өөрчлөгдөхгүй: 2 · (${a} + ${b}) = ${2*(a+b)} см.`));}
  if(v==='krychleVS'){const a=randInt(2,9),ask=pick(['V','S']);
    if(ask==='V')return mk('gym-geometrie','krychleVS',T(`Povrch krychle je ${6*a*a} cm². Jaký je její objem (v cm³)?`,`Кубын гадаргуу ${6*a*a} см². Түүний эзэлхүүн хэд вэ (см³)?`),a*a*a,
      T(`Jedna stěna: ${6*a*a} : 6 = ${a*a} cm², hrana ${a} cm. Objem: ${a}³ = ${a*a*a} cm³.`,`Нэг нүүр: ${6*a*a} : 6 = ${a*a} см², ирмэг ${a} см. Эзэлхүүн: ${a}³ = ${a*a*a} см³.`));
    return mk('gym-geometrie','krychleVS',T(`Objem krychle je ${a*a*a} cm³. Jaký je její povrch (v cm²)?`,`Кубын эзэлхүүн ${a*a*a} см³. Түүний гадаргуу хэд вэ (см²)?`),6*a*a,
      T(`Hrana: ${a} cm (${a}·${a}·${a} = ${a*a*a}). Povrch: 6 · ${a*a} = ${6*a*a} cm².`,`Ирмэг: ${a} см (${a}·${a}·${a} = ${a*a*a}). Гадаргуу: 6 · ${a*a} = ${6*a*a} см².`));}
  if(v==='kvadrHrana'){const a=randInt(2,9),b=randInt(2,9),c=randInt(2,9),V=a*b*c;
    return mk('gym-geometrie','kvadrHrana',T(`Kvádr má objem ${V} cm³ a dvě hrany ${a} cm a ${b} cm. Jak dlouhá je třetí hrana (v cm)?`,`Тэгш өнцөгт хайрцгийн эзэлхүүн ${V} см³, хоёр ирмэг нь ${a} см ба ${b} см. Гурав дахь ирмэг хэдэн см вэ?`),c,
      T(`c = V : (a · b) = ${V} : ${a*b} = ${c} cm.`,`c = V : (a · b) = ${V} : ${a*b} = ${c} см.`));}
  if(v==='ctvDouble'){const k=pick([2,3,4,5]);
    return mk('gym-geometrie','ctvDouble',T(`Strana čtverce se zvětší ${k}krát. Kolikrát se zvětší jeho obsah?`,`Дөрвөлжингийн тал ${k} дахин ихсэв. Түүний талбай хэд дахин ихсэх вэ?`),k*k,
      T(`Nová strana ${k}a, nový obsah (${k}a)² = ${k*k}a². Obsah se zvětší ${k*k}krát.`,`Шинэ тал ${k}a, шинэ талбай (${k}a)² = ${k*k}a². Талбай ${k*k} дахин ихснэ.`));}
  if(v==='painted'){const n=randInt(3,6),w=pick(['one','two','three','zero']);
    const ans=w==='one'?6*(n-2)**2:w==='two'?12*(n-2):w==='three'?8:(n-2)**3;
    const lbCs={one:'právě jednu stěnu',two:'právě dvě stěny',three:'právě tři stěny',zero:'žádnou stěnu'},lbMn={one:'яг нэг нүүр',two:'яг хоёр нүүр',three:'яг гурван нүүр',zero:'ямар ч нүүр'};
    const exCs={one:`Na každé z 6 stěn je (${n}−2)² = ${(n-2)**2} takových kostiček: 6 · ${(n-2)**2} = ${ans}.`,two:`Každá z 12 hran má ${n-2} takových kostiček: 12 · ${n-2} = ${ans}.`,three:`Jsou to 8 rohových kostiček: ${ans}.`,zero:`Uvnitř zůstane krychle ${n-2}×${n-2}×${n-2} = ${ans}.`};
    const exMn={one:`6 нүүр бүр дээр (${n}−2)² = ${(n-2)**2} ийм кубик байна: 6 · ${(n-2)**2} = ${ans}.`,two:`12 ирмэг бүр дээр ${n-2} ийм кубик байна: 12 · ${n-2} = ${ans}.`,three:`Булангийн 8 кубик: ${ans}.`,zero:`Дотор нь ${n-2}×${n-2}×${n-2} = ${ans} кубик үлдэнэ.`};
    return mk('gym-geometrie','painted',T(`Velká krychle ${n}×${n}×${n} z malých krychliček se celá obarví zvenku a rozřeže zpět na malé krychličky. Kolik krychliček má obarvenou ${lbCs[w]}?`,`${n}×${n}×${n} том куб жижиг кубуудаас бүрдэнэ. Гаднаас нь будаад дахин жижиг кубууд болгон хуваав. Хэдэн кубик ${lbMn[w]}-тэй будагдсан бэ?`),ans,T(exCs[w],exMn[w]));}
  const a=randInt(2,9),b=randInt(2,9),c=randInt(2,9);
  return mk('gym-geometrie','povrchKvadr',T(`Vypočítej povrch kvádru s hranami ${a} cm, ${b} cm a ${c} cm (v cm²).`,`${a} см, ${b} см, ${c} см ирмэгтэй тэгш өнцөгт хайрцгийн гадаргууг бод (см²).`),2*(a*b+b*c+a*c),
    T(`S = 2 · (a·b + b·c + a·c) = 2 · (${a*b} + ${b*c} + ${a*c}) = ${2*(a*b+b*c+a*c)} cm².`,`S = 2 · (a·b + b·c + a·c) = 2 · (${a*b} + ${b*c} + ${a*c}) = ${2*(a*b+b*c+a*c)} см².`));
}

// --- Přijímačkové slovní úlohy / Элсэлтийн шалгалтын бодлого ---
function genGymSlovni(level){
  const v=pick(level===1?['soucRozd','slepice','kombin']:level===2?['soucRozd','slepice','mince','prace','kombin']:['prace','potk','vek','mince','slepice','soucRozd','kombin']);
  if(v==='soucRozd'){const b=randInt(8,60),a=b+randInt(2,30),S=a+b,D=a-b,big=Math.random()<0.5;
    return mk('gym-slovni','soucRozd',T(`Součet dvou čísel je ${S} a jejich rozdíl je ${D}. Které je ${big?'větší':'menší'} číslo?`,`Хоёр тооны нийлбэр ${S}, зөрүү нь ${D}. ${big?'Том':'Жижиг'} тоо нь аль вэ?`),big?a:b,
      T(`Větší: (${S} + ${D}) : 2 = ${a}. Menší: (${S} − ${D}) : 2 = ${b}.`,`Том тоо: (${S} + ${D}) : 2 = ${a}. Жижиг тоо: (${S} − ${D}) : 2 = ${b}.`));}
  if(v==='slepice'){const r=randInt(3,12),c=randInt(3,15),h=r+c,L=4*r+2*c;
    return mk('gym-slovni','slepice',T(`Na dvoře jsou králíci a slepice. Dohromady mají ${h} hlav a ${L} nohou. Kolik je králíků?`,`Хашаанд туулай ба тахиа байна. Нийт ${h} толгой, ${L} хөлтэй. Хэдэн туулай байна вэ?`),r,
      T(`Kdyby všichni měli 2 nohy: ${2*h}. Zbývá ${L-2*h} nohou, každý králík má o 2 víc: ${L-2*h} : 2 = ${r}.`,`Хэрэв бүгд 2 хөлтэй бол ${2*h}. ${L-2*h} хөл илүү, туулай бүр 2-оор илүү: ${L-2*h} : 2 = ${r}.`));}
  if(v==='kombin'){const n=pick([3,4,5]),mode=n===3?'rep':pick(['norep','rep']);
    if(mode==='rep')return mk('gym-slovni','kombin',T(`Kolik trojciferných čísel lze napsat z číslic ${[1,2,3,4,5].slice(0,n).join(', ')} (číslice se mohou opakovat)?`,`${[1,2,3,4,5].slice(0,n).join(', ')} цифрүүдээс (давтаж болно) хэдэн гурван оронтой тоо бичиж болох вэ?`),n**3,
      T(`Na každém ze 3 míst máme ${n} možností: ${n} · ${n} · ${n} = ${n**3}.`,`3 орон тус бүрт ${n} боломж: ${n} · ${n} · ${n} = ${n**3}.`));
    return mk('gym-slovni','kombin',T(`Kolik trojciferných čísel lze napsat z číslic ${[1,2,3,4,5].slice(0,n).join(', ')}, pokud se žádná číslice neopakuje?`,`${[1,2,3,4,5].slice(0,n).join(', ')} цифрүүдээс (цифр давтахгүйгээр) хэдэн гурван оронтой тоо бичиж болох вэ?`),n*(n-1)*(n-2),
      T(`Na první místo ${n} možností, na druhé ${n-1}, na třetí ${n-2}: ${n} · ${n-1} · ${n-2} = ${n*(n-1)*(n-2)}.`,`Эхний оронд ${n} боломж, хоёрдугаарт ${n-1}, гуравдугаарт ${n-2}: ${n} · ${n-1} · ${n-2} = ${n*(n-1)*(n-2)}.`));}
  if(v==='mince'){const a=randInt(3,15),b=randInt(2,12),n=a+b,V=2*a+5*b;

  if(v==='prace'){const [x,y,t]=pick([[6,3,2],[12,6,4],[10,15,6],[20,30,12],[4,12,3],[6,12,4],[8,8,4],[12,12,6],[9,18,6],[15,30,10]]);const j1=jmeno(),j2=jinyJmeno(j1);

      T(`Za 1 den vykopou 1/${x} + 1/${y} = 1/${t} zahrady. Celá zahrada za ${t} dní.`,`1 өдөрт цэцэрлэгийн 1/${x} + 1/${y} = 1/${t}-ийг ухна. Бүхэлд нь ${t} өдөрт ухна.`));}
  if(v==='potk'){const v1=randInt(4,9)*5,v2=randInt(4,9)*5,t=randInt(2,4),D=(v1+v2)*t;
    return mk('gym-slovni','potk',T(`Dva chodci jdou proti sobě z míst vzdálených ${D} km rychlostmi ${v1} km/h a ${v2} km/h. Za kolik hodin se potkají?`,`Хоёр явган хүн ${D} км зайтай газраас ${v1} км/ц ба ${v2} км/ц хурдтай эсрэг тийш явна. Хэдэн цагийн дараа уулзах вэ?`),t,
      T(`Za hodinu se přiblíží o ${v1+v2} km. ${D} : ${v1+v2} = ${t} h.`,`Цагт ${v1+v2} км-ээр ойртоно. ${D} : ${v1+v2} = ${t} цаг.`));}
  const k=pick([4,5,6,7]),s=randInt(2,9),y=s*(k-2);

}

function genGymMix(level){return pick([genPriorita,genDelitelnost,genRovnice,genPrumer,genProcenta,genRychlost,genGeomGym,genGymSlovni])(level);}

function dily(n){return n===1?'díl':n<5?'díly':'dílů';}

function genCmVypocty(level){
  const v=pick(level===1?['vyraz1','jedn1','jedn2']:level===2?['vyraz1','vyraz2','jedn1','jedn2','jedn3']:['vyraz2','vyraz3','vyraz4','jedn1','jedn2','jedn3']);
  const head=T('Vypočtěte: ','Бод: ');
  if(v==='vyraz1'){
    const c=randInt(2,9),q=randInt(2,9),g=randInt(2,6),r=randInt(2,9),f=randInt(3,12),a=randInt(q+5,q+60);
    const val=a-q+r;
    return mk('cm-vypocty','vyraz',head+`${a} − ${c*q} : ${c} + ${g*r} : (${f+g} − ${f})`,val,
      T(`${c*q} : ${c} = ${q}; ${f+g} − ${f} = ${g}; ${g*r} : ${g} = ${r}; ${a} − ${q} + ${r} = ${val}.`,`${c*q} : ${c} = ${q}; ${f+g} − ${f} = ${g}; ${g*r} : ${g} = ${r}; ${a} − ${q} + ${r} = ${val}.`));
  }
  if(v==='vyraz2'){
    const c=pick([4,5,8,10,20,25,40]),b=c*randInt(5,60),a=pick([20,25,30,40,50,60]);
    const val=a*b-b/c+c;
    return mk('cm-vypocty','vyraz',head+`${a} ⋅ ${b} − ${b} : ${c} + ${c}`,val,
      T(`${a} ⋅ ${b} = ${a*b}; ${b} : ${c} = ${b/c}; ${a*b} − ${b/c} + ${c} = ${val}.`,`${a} ⋅ ${b} = ${a*b}; ${b} : ${c} = ${b/c}; ${a*b} − ${b/c} + ${c} = ${val}.`));
  }
  if(v==='vyraz3'){
    const p=randInt(2,9),q=randInt(2,40)*100,r=10*randInt(2,9),val=(p*q+r*r)/10;
    return mk('cm-vypocty','vyraz',head+`(${p} ⋅ ${q} + ${r} ⋅ ${r}) : 10`,val,
      T(`${p} ⋅ ${q} = ${p*q}; ${r} ⋅ ${r} = ${r*r}; součet ${p*q+r*r}; ${p*q+r*r} : 10 = ${val}.`,`${p} ⋅ ${q} = ${p*q}; ${r} ⋅ ${r} = ${r*r}; нийлбэр ${p*q+r*r}; ${p*q+r*r} : 10 = ${val}.`));
  }
  if(v==='vyraz4'){
    for(let i=0;i<500;i++){
      const a=randInt(2,9),b=randInt(3,15),d=randInt(2,5),k=randInt(2,9),c=d*k,inner=a*b-k,m=randInt(5,40),g=randInt(2,m-1),f=randInt(2,9),e=f*g;
      if(inner<=0)continue;
      const N=inner*m,val=m-g;
      return mk('cm-vypocty','vyraz',head+`${N} : (${a} ⋅ ${b} − ${c} : ${d}) − ${e} : ${f}`,val,
        T(`${c} : ${d} = ${k}; ${a} ⋅ ${b} − ${k} = ${inner}; ${N} : ${inner} = ${m}; ${e} : ${f} = ${g}; ${m} − ${g} = ${val}.`,`${c} : ${d} = ${k}; ${a} ⋅ ${b} − ${k} = ${inner}; ${N} : ${inner} = ${m}; ${e} : ${f} = ${g}; ${m} − ${g} = ${val}.`));
    }
  }
  if(v==='jedn1'){
    const ks={2:'polovina',4:'čtvrtina',5:'pětina',10:'desetina',20:'dvacetina'};
    let k,x; do{k=pick([2,4,5,10,20]);x=pick([1,2,5,10,20,25,50]);}while((1000/k)%x!==0);
    return mk('cm-vypocty','jednotky',T(`Vypočtěte, kolikrát je ${x} m kratší než ${ks[k]} kilometru.`,`${x} м нь 1 км-ийн 1/${k}-ээс хэд дахин богино болохыг бод.`),(1000/k)/x,
      T(`1/${k} km = ${1000/k} m; ${1000/k} : ${x} = ${(1000/k)/x}.`,`1/${k} км = ${1000/k} м; ${1000/k} : ${x} = ${(1000/k)/x}.`));
  }
  if(v==='jedn2'){
    const big=pick([[500,'půlkilogramové','0,5 кг-ын'],[250,'čtvrtkilogramové','0,25 кг-ын'],[1000,'kilogramové','1 кг-ын'],[750,'750gramové','750 граммын']]),y=pick([20,40,50,60,80,100,120]);
    return mk('cm-vypocty','jednotky',T(`Vypočtěte, o kolik gramů je ${big[1]} závaží těžší než ${y}gramové závaží.`,`${big[2]} жин нь ${y} граммын жингээс хэдэн граммаар хүнд болохыг бод.`),big[0]-y,
      T(`${big[0]} g − ${y} g = ${big[0]-y} g.`,`${big[0]} г − ${y} г = ${big[0]-y} г.`));
  }
  const h=pick([2,3,4,5]),m=pick([25,35,40,45,50,55]),mins=h*60,n=Math.floor(mins/m);
  return mk('cm-vypocty','jednotky',T(`Vypočtěte, kolik nejvíce celých ${m}minutových dílů seriálu lze zhlédnout za ${h} ${h<5?'hodiny':'hodin'} (díly se přehrávají původní rychlostí).`,`${h} цагт ${m} минутын цувралын хамгийн ихдээ хэдэн бүтэн ангийг үзэж болохыг бод.`),n,
    T(`${h} h = ${mins} min; ${mins} : ${m} = ${n} (zbytek ${mins-n*m} min nestačí na další díl).`,`${h} цаг = ${mins} мин; ${mins} : ${m} = ${n} (үлдсэн ${mins-n*m} мин дараагийн ангид хүрэхгүй).`));
}

function genCmUvahy(level){
  const easy=['cenag','katka','cifry','stuha','cisla'], mid=['mince3','cas','kapesne','kruh'], hard=['zetony','vymeny'];
  const v=pick(level===1?easy:level===2?[...easy,...mid]:[...mid,...hard,...hard]);
  const j=jmeno(), j2=jinyJmeno(j);
  if(v==='mince3'){
    const [a,b,c]=pick([[1,2,5],[1,5,10],[2,5,10],[1,2,10],[2,3,5]]);
    const ds=[a,b,c],sums=new Set();ds.forEach(x=>ds.forEach(y=>ds.forEach(z=>sums.add(x+y+z))));
    const missing=[];for(let s=3*a;s<=3*c;s++)if(!sums.has(s))missing.push(s);
    if(!missing.length)return genCmUvahy(level);
    return mk('cm-uvahy','mince3',T(`${j} měl(a) v kasičce tři mince po ${a} Kč, tři po ${b} Kč a tři po ${c} Kč. Vyklepal(a) z kasičky tři mince. Nejméně tak mohl(a) získat ${3*a} Kč a nejvíce ${3*c} Kč. Kolik různých částek (v celých korunách) mezi ${3*a} a ${3*c} Kč včetně tak získat nemohl(a)?`,
      `${j}-ийн хадгаламжийн савинд ${a}₮-ийн гурван, ${b}₮-ийн гурван, ${c}₮-ийн гурван зоос байв. Савнаас гурван зоос гаргав. Хамгийн багадаа ${3*a}₮, хамгийн ихдээ ${3*c}₮ авч болно. ${3*a}-аас ${3*c}₮ хүртэл (хоёр захыг оруулан) хэдэн өөр дүнг авч чадахгүй вэ?`),missing.length,
      T(`Možné součty: ${[...sums].sort((x,y)=>x-y).join(', ')}. Nemožné: ${missing.join(', ')} → ${missing.length}.`,`Боломжит нийлбэрүүд: ${[...sums].sort((x,y)=>x-y).join(', ')}. Боломжгүй: ${missing.join(', ')} → ${missing.length}.`));
  }
  if(v==='cenag'){
    const goods=pick([[T('masa','мах'),T('masa','махны')],[T('sýra','бяслаг'),T('sýra','бяслагны')],[T('šunky','хиам'),T('šunky','хиамны')],[T('oříšků','самар'),T('oříšků','самрын')]]);
    for(let i=0;i<300;i++){
      const p=pick([120,150,180,240,300,360,450,600]),g=pick([50,100,150,200,250,300,400,500,600]),cost=p*g/1000;
      if(!Number.isInteger(cost))continue;
      if(Math.random()<0.5)return mk('cm-uvahy','cenag',T(`V obchodě stojí 1 kg ${goods[0]} ${p} Kč. Kolik korun zaplatíme za ${g} g?`,`Дэлгүүрт 1 кг ${goods[0]} ${p}₮ байна. ${g} г-ийг авбал хэдэн төгрөг төлөх вэ?`),cost,
        T(`${g} g = ${g/1000} kg; ${p} · ${g/1000} = ${cost} Kč.`,`${g} г = ${g/1000} кг; ${p} · ${g/1000} = ${cost}₮.`));

function genCmVzory(level){
  const F=[
    {f:n=>n*n,d:n=>2*n-1,cs:'n · n',nl:true,kind:'sq'},
    {f:n=>n*(n+1),d:n=>2*n,cs:'n · (n + 1)',nl:true,kind:'rect'},
    {f:n=>n*(n+1)/2,d:n=>n,cs:'n · (n + 1) : 2',nl:true,kind:'tri'},
    {f:n=>n*n+1,d:n=>2*n-1,cs:'n · n + 1',nl:true,kind:'sqp'},
    {f:n=>3*n-1,d:n=>3,cs:'3 · n − 1',nl:false,kind:'l3'},
    {f:n=>4*n+2,d:n=>4,cs:'4 · n + 2',nl:false,kind:'b4'}
  ];
  const o=pick(F), seq=[1,2,3,4].map(o.f), lim=level===1?9:level===2?20:60;
  const t=pick(o.nl?['hodnota','rozdil','ktery']:['hodnota','rozdil']);
  const figs='<span class="figs">'+[1,2,3,4].map(n=>`<span class="fig">${figSvg(o.kind,n)}<span class="figcap">${n}. ${T('obrazec','дүрс')}</span></span>`).join('')+'</span>';
  const intro=T('Na obrázku jsou první čtyři obrazce z puntíků. Pravidlo se stále opakuje. ','Зурагт цэгүүдээс бүрдсэн эхний дөрвөн дүрс байна. Дүрэм үргэлжилнэ. ')+figs+'<br>';
  const cnt=T(`(V 1.–4. obrazci je ${seq.join(', ')} puntíků.) `,`(1–4-р дүрсэнд ${seq.join(', ')} цэг байна.) `);
  if(t==='hodnota'){const k=randInt(5,lim);

/* ---------- Zvukové efekty (Web Audio, žádné externí soubory) ---------- */
let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC) audioCtx=new AC();
  }
  return audioCtx;
}
function playBeep(ctx,freq,startTime,duration,type,peakGain){
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type=type; osc.frequency.value=freq;
  gain.gain.setValueAtTime(0,startTime);
  gain.gain.linearRampToValueAtTime(peakGain,startTime+0.015);
  gain.gain.exponentialRampToValueAtTime(0.001,startTime+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(startTime); osc.stop(startTime+duration+0.03);
}
function isSoundOn(){ return localStorage.getItem('matematika_sound_v1')!=='off'; }
function setSoundOn(on){ localStorage.setItem('matematika_sound_v1', on?'on':'off'); }
function playCorrectSound(){
  if(!isSoundOn())return;
  const ctx=getAudioCtx(); if(!ctx)return;
  const now=ctx.currentTime;
  [523.25,659.25,783.99].forEach((f,i)=>playBeep(ctx,f,now+i*0.07,0.16,'sine',0.11));
}
function playWrongSound(){
  if(!isSoundOn())return;
  const ctx=getAudioCtx(); if(!ctx)return;
  playBeep(ctx,190,ctx.currentTime,0.28,'sawtooth',0.07);
}
function playStreakSound(){
  if(!isSoundOn())return;
  const ctx=getAudioCtx(); if(!ctx)return;
  const now=ctx.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>playBeep(ctx,f,now+i*0.09,0.18,'triangle',0.13));
}

const CONFETTI_COLORS=['#2f5fd6','#7c5cff','#e0483f','#f2ab27','#1fae6e','#22d3ee'];
function burstConfetti(layer,big){
  const count=big?36:18;
  for(let i=0;i<count;i++){
    const el=document.createElement('span');
    el.className='confetti-piece';
    const angle=Math.random()*Math.PI-Math.PI/2-Math.PI/2;
    const dist=(big?90:55)+Math.random()*(big?90:45);
    const x=Math.cos(angle)*dist*(Math.random()<0.5?1:-1);
    const y= -Math.abs(Math.sin(angle)*dist) - 10;
    el.style.setProperty('--x', x+'px');
    el.style.setProperty('--y', y+'px');

function recordAttempt(topicId,correct){
  const cur=progress[topicId]||{correct:0,total:0,streak:0,best:0};
  const streak=correct?cur.streak+1:0;

  saveProgress(progress);
}


/* ================= OBRAZCE – KRESLENÍ / ДҮРСИЙН ЗУРАГ ================= */
function figPoints(kind,n){
  const P=[];
  if(kind==='sq'){for(let i=0;i<n;i++)for(let j=0;j<n;j++)P.push([i,j,0]);}
  else if(kind==='rect'){for(let i=0;i<n;i++)for(let j=0;j<n+1;j++)P.push([i,j,0]);}
  else if(kind==='tri'){for(let r=0;r<n;r++)for(let k=0;k<=r;k++)P.push([k+(n-1-r)/2,r,0]);}
  else if(kind==='sqp'){for(let i=0;i<n;i++)for(let j=0;j<n;j++)P.push([i,j,0]);P.push([n+0.6,0,1]);}
  else if(kind==='l3'){for(let i=0;i<n;i++)for(let j=0;j<3;j++){if(i===n-1&&j===2)continue;P.push([i,j,0]);}}
  else {for(let b=0;b<n;b++)for(let i=0;i<2;i++)for(let j=0;j<2;j++)P.push([b*2.8+i,j,0]);P.push([n*2.8,0,1]);P.push([n*2.8,1,1]);}
  return P;
}
function figSvg(kind,n){
  const P=figPoints(kind,n),g=11,r=3.6,pad=7;
  const w=Math.max(...P.map(p=>p[0]))*g+2*pad, h=Math.max(...P.map(p=>p[1]))*g+2*pad;
  const dots=P.map(p=>`<circle cx="${(pad+p[0]*g).toFixed(1)}" cy="${(pad+p[1]*g).toFixed(1)}" r="${r}" fill="${p[2]?'#e0483f':'#2f5fd6'}"/>`).join('');
  return `<svg viewBox="0 0 ${w.toFixed(1)} ${h.toFixed(1)}" width="${(w*1.6).toFixed(0)}" height="${(h*1.6).toFixed(0)}" aria-hidden="true">${dots}</svg>`;
}

/* ================= TESTOVÝ REŽIM / ХУГАЦААТАЙ ТЕСТ ================= */
function uniqueGen(fn,level,seen){
  for(let i=0;i<40;i++){const e=fn(level),key=e.question+'|'+(e.choices||[]).join('|');if(!seen.has(key)){seen.add(key);return e;}}
  return fn(level);
}
function buildMathTest(){
  const seen=new Set();
  const plan=[[genCmVypocty,1],[genCmVypocty,2],[genCmUvahy,1],[genCmUvahy,1],[genCmVzory,2],[genCmUvahy,2],[genCmUvahy,2],[genPrumer,2],[genRovnice,2],[genCmVypocty,3],[genCmUvahy,3],[genCmUvahy,3],[genGeomGym,3],[genCmVzory,3]];
  return plan.map(([f,l])=>uniqueGen(f,l,seen));
}
function buildCjTest(){
  const seen=new Set();
  const plan=[[genCmText,2],[genCmText,2],[genCmText,3],[genCmPravopis,2],[genCmPravopis,2],[genCmPravopis,3],[genCmSpisovnost,2],[genCmSpisovnost,3],[genCmVztahy,2],[genCmVztahy,3],
    [genCmZdrobneniny,2],[genCmZdrobneniny,3],[genCjDruhy,2],[genCjDruhy,2],[genCjDruhy,3],[genCjPady,2],[genCjPady,2],[genCjPady,3],[genCjSkladba,2],[genCjSkladba,2],[genCjSkladba,3],
    [genCjIY,2],[genCjIY,3],[genCjIY,3],[genCjPravopis,2],[genCjPravopis,3],[genCjSlovesa,3],[genCjCteni,2]];
  return shuffleArr(plan).map(([f,l])=>uniqueGen(f,l,seen));
}
const TEST_DEFS={
  'cm-mix-m':{minutes:70,count:14,build:buildMathTest},
  'cm-mix-cj':{minutes:60,count:28,build:buildCjTest}
};
function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}

function startTest(id){
  const d=TEST_DEFS[id], tasks=d.build();
  state.test={topicId:id,tasks,answers:tasks.map(()=>''),idx:0,start:Date.now(),limit:d.minutes*60,endAt:Date.now()+d.minutes*60000,done:false};
  state.view='test';
  startTestTimer();
  render();
  window.scrollTo({top:0});
}
function startTestTimer(){
  clearInterval(state.testTimer);
  state.testTimer=setInterval(()=>{
    const t=state.test;
    if(!t||t.done||state.view!=='test'){clearInterval(state.testTimer);return;}
    const rem=Math.max(0,Math.round((t.endAt-Date.now())/1000));
    const el=document.getElementById('test-timer');
    if(el){el.textContent=fmtTime(rem);el.classList.toggle('is-low',rem<=300);}
    if(rem<=0)finishTest(true);
  },500);
}
function confirmClick(btn,label,action){
  let armed=false,timer;const orig=btn.textContent;
  btn.addEventListener('click',()=>{
    if(!armed){armed=true;btn.textContent=label;btn.classList.add('is-armed');
      timer=setTimeout(()=>{armed=false;btn.textContent=orig;btn.classList.remove('is-armed');},4000);}
    else{clearTimeout(timer);action();}
  });
}
function finishTest(timeout){
  const t=state.test;if(!t||t.done)return;
  clearInterval(state.testTimer);
  t.done=true;t.timeout=!!timeout;
  t.used=Math.min(t.limit,Math.round((Date.now()-t.start)/1000));
  t.results=t.tasks.map((ex,i)=>({ok:!!t.answers[i]&&checkAnswer(ex,t.answers[i])}));
  t.results.forEach(r=>recordAttempt(t.topicId,r.ok));
  state.view='testresult';
  render();
  window.scrollTo({top:0});
}

function renderTest(){
  const t=state.test,ex=t.tasks[t.idx],N=t.tasks.length;
  const rem=Math.max(0,Math.round((t.endAt-Date.now())/1000));
  const textChoices=!!(ex.choices&&ex.choices.some(c=>String(c).length>6));
  const nav=t.tasks.map((_,i)=>`<button type="button" class="tn${i===t.idx?' is-current':''}${t.answers[i]?' is-answered':''}" data-i="${i}">${i+1}</button>`).join('');
  const numeric=/^-?\d+([.,]\d+)?$/.test(ex.answer);
  app.innerHTML=`
    <div class="exercise-shell"><div class="exercise-page">
      <div class="test-bar">
        <div class="test-timer${rem<=300?' is-low':''}" id="test-timer">${fmtTime(rem)}</div>
        <div class="test-meta">${T('Úloha','Бодлого')} ${t.idx+1} / ${N}</div>
        <button type="button" class="ghost-btn" id="quit-test">${T('Ukončit','Гарах')}</button>

      <div class="test-nav" id="test-nav">${nav}</div>
      <p class="exercise-question">${ex.question}</p>
      ${ex.choices
        ? `<div class="choice-row${textChoices?' is-text':''}">${ex.choices.map(c=>`<button type="button" class="choice-btn${t.answers[t.idx]===String(c)?' is-selected':''}" data-choice="${escAttr(c)}">${escAttr(c)}</button>`).join('')}</div>`
        : `<input class="exercise-input" type="text" inputmode="${numeric?'decimal':'text'}" placeholder="${T('Tvoje odpověď','Чиний хариулт')}" id="test-input" value="${escAttr(t.answers[t.idx])}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`}
      <div class="test-actions">
        <button type="button" class="ghost-btn" id="prev-task"${t.idx===0?' disabled':''}>← ${T('Předchozí','Өмнөх')}</button>
        <button type="button" class="next-btn" id="next-task"${t.idx===N-1?' disabled':''}>${T('Další','Дараах')} →</button>
      </div>
    </div></div>`;
  const go=i=>{t.idx=i;renderTest();window.scrollTo({top:0});};
  document.querySelectorAll('#test-nav .tn').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.i))));
  document.getElementById('prev-task').addEventListener('click',()=>go(t.idx-1));
  document.getElementById('next-task').addEventListener('click',()=>go(t.idx+1));
  if(ex.choices){
    document.querySelectorAll('.choice-btn').forEach(b=>b.addEventListener('click',()=>{
      t.answers[t.idx]=b.dataset.choice;
      document.querySelectorAll('.choice-btn').forEach(x=>x.classList.toggle('is-selected',x===b));
      const nb=document.querySelector('#test-nav .tn.is-current');if(nb)nb.classList.add('is-answered');
    }));
  } else {
    const inp=document.getElementById('test-input');
    inp.addEventListener('input',()=>{
      t.answers[t.idx]=inp.value.trim();
      const nb=document.querySelector('#test-nav .tn.is-current');if(nb)nb.classList.toggle('is-answered',!!t.answers[t.idx]);
    });
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&t.idx<N-1){e.preventDefault();go(t.idx+1);}});
  }
  const unanswered=t.answers.filter(a=>!a).length;
  confirmClick(document.getElementById('submit-test'),T(`Opravdu? (nevyplněno: ${unanswered}) – klikni znovu`,`Үнэхээр үү? (хоосон: ${unanswered}) – дахин дар`),()=>finishTest(false));
  confirmClick(document.getElementById('quit-test'),T('Smazat test? Klikni znovu','Тестийг устгах уу? Дахин дар'),()=>{clearInterval(state.testTimer);state.test=null;navigate(()=>{state.view='menu';});});
}

function lessonHtml(blocks){
  return blocks.map(b=>{
    const k=b[0];
    if(k==='h') return `<h3 class="ls-h">${tx(b[1])}</h3>`;
    if(k==='p') return `<p class="ls-p">${tx(b[1])}</p>`;
    if(k==='rule') return `<div class="ls-rule"><span class="ls-badge">${T('Pravidlo','Дүрэм')}</span>${tx(b[1])}</div>`;
    if(k==='tip') return `<div class="ls-tip"><span class="ls-badge">💡 ${T('Tip','Зөвлөгөө')}</span>${tx(b[1])}</div>`;
    if(k==='list') return `<ul class="ls-list">${b[1].map(i=>`<li>${tx(i)}</li>`).join('')}</ul>`;
    if(k==='ex') return `<div class="ls-ex"><div class="ls-ex-q"><b>${T('Příklad','Жишээ')}:</b> ${tx(b[1])}</div><ol class="ls-steps">${b[2].map(s=>`<li>${tx(s)}</li>`).join('')}</ol><div class="ls-ans">${T('Výsledek','Хариу')}: <b>${tx(b[3])}</b></div></div>`;
    if(k==='table') return `<div class="ls-tw"><table class="ls-table"><thead><tr>${b[1].map(h=>`<th>${tx(h)}</th>`).join('')}</tr></thead><tbody>${b[2].map(r=>`<tr>${r.map(c=>`<td>${tx(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(k==='svg') return `<figure class="ls-fig">${b[1]}<figcaption>${tx(b[2])}</figcaption></figure>`;
    if(k==='figs') return `<figure class="ls-fig"><span class="figs">${[1,2,3,4].map(n=>`<span class="fig">${figSvg(b[1],n)}<span class="figcap">${n}.</span></span>`).join('')}</span><figcaption>${tx(b[2])}</figcaption></figure>`;
    return '';
  }).join('');
}

function buildLessonCards(host){
  const secs=[['math',T('Matematika – metody a postupy','Математик – арга, бодох зам')],['cj',T('Český jazyk – pravidla','Чех хэл – дүрэм')]];
  let idx=0;
  secs.forEach(([sid,title])=>{
    const wrap=document.createElement('section');wrap.className='topic-section';
    wrap.innerHTML=`<h2 class="section-title">${title}</h2>`;
    const g=document.createElement('div');g.className='topic-grid';wrap.appendChild(g);host.appendChild(wrap);
    LESSONS.filter(l=>l.section===sid).forEach(l=>{
      const [a,b]=ACCENTS[idx%ACCENTS.length];
      const card=document.createElement('button');card.className='topic-card';
      card.style.setProperty('--accent-a',a);card.style.setProperty('--accent-b',b);card.style.animationDelay=(idx*0.04)+'s';idx++;
      card.innerHTML=`<div class="topic-card-top"><span class="topic-card-icon">${iconSvg(l.icon)}</span><span class="topic-card-grade">${T('Lekce','Хичээл')}</span></div>
        <h3 class="topic-card-title">${tx(l.title)}</h3><p class="topic-card-desc">${tx(l.desc)}</p>
        <div class="topic-card-footer"><span class="topic-card-progress-text">${T('Otevřít lekci →','Хичээл нээх →')}</span></div>`;
      card.addEventListener('click',()=>{navigate(()=>{state.view='lesson';state.lessonId=l.id;});});
      g.appendChild(card);
    });
  });
}

function renderLesson(){
  const i=LESSONS.findIndex(l=>l.id===state.lessonId),l=LESSONS[i];
  const prev=LESSONS[i-1]&&LESSONS[i-1].section===l.section?LESSONS[i-1]:null,next=LESSONS[i+1]&&LESSONS[i+1].section===l.section?LESSONS[i+1]:null;
  const [a,b]=ACCENTS[i%ACCENTS.length];
  app.innerHTML=`
    <div class="exercise-shell"><div class="exercise-page lesson-page">
      <div class="exercise-topbar">
        <button class="back-link" id="back-btn">${T('← Zpět na lekce','← Хичээлүүд рүү буцах')}</button>
        <div class="topbar-right">${langToggleHtml('lang-toggle-exercise')}</div>
      </div>
      <p class="exercise-topic-label"><span class="exercise-topic-icon" style="background:linear-gradient(135deg,${a},${b})">${iconSvg(l.icon)}</span>${tx(l.title)}</p>
      ${lessonHtml(l.blocks)}
      <div class="test-actions">
        <button class="next-btn" id="practice-btn">${T('Procvičit toto téma →','Энэ сэдвийг дасгалжуулах →')}</button>
      </div>
      <div class="ls-nav">
        ${prev?`<button class="ghost-btn" id="prev-ls">← ${tx(prev.title)}</button>`:'<span></span>'}
        ${next?`<button class="ghost-btn" id="next-ls">${tx(next.title)} →</button>`:'<span></span>'}
      </div>
    </div></div>`;
  document.getElementById('back-btn').addEventListener('click',()=>{navigate(()=>{state.view='menu';state.tab='lessons';});});
  document.getElementById('practice-btn').addEventListener('click',()=>{
    const topic=TOPICS.find(t=>t.id===l.practice);
    navigate(()=>{
      if(TEST_DEFS[l.practice]){state.view='testintro';state.topicId=l.practice;return;}
      state.view='exercise';state.topicId=l.practice;state.level=2;state.exercise=topic.generate(2);state.status=null;
    });
  });
  if(prev)document.getElementById('prev-ls').addEventListener('click',()=>{navigate(()=>{state.lessonId=prev.id;});});
  if(next)document.getElementById('next-ls').addEventListener('click',()=>{navigate(()=>{state.lessonId=next.id;});});
  wireLangToggle(app.querySelector('.lang-toggle-exercise'));
}

/* ---------- Render ---------- */
const app=document.getElementById('app');

function render(){
  if(state.view==='menu') renderMenu();
  else if(state.view==='testintro') renderTestIntro();
  else if(state.view==='test') renderTest();
  else if(state.view==='testresult') renderTestResult();
  else if(state.view==='lesson') renderLesson();
  else renderExercise();
}

/* Smoothly cross-fades #app when navigating between views or loading a new question,
   instead of an abrupt instant swap. */
function navigate(mutateFn, opts){
  const scroll = opts && 'scroll' in opts ? opts.scroll : true;
  const duration = opts && opts.duration ? opts.duration : 170;
  const swap=()=>{
    mutateFn();
    render();
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ app.classList.remove('view-leaving'); }); });
    if(scroll) window.scrollTo({top:0,behavior:'smooth'});
  };
  if(app.children.length===0){ swap(); return; }
  app.classList.add('view-leaving');
  setTimeout(swap, duration);
}

function langToggleHtml(idExtra){
  return `<div class="lang-toggle${idExtra?' '+idExtra:''}">
    <button type="button" class="lang-btn ${LANG==='cs'?'is-active':''}" data-lang="cs">CZ</button>
    <button type="button" class="lang-btn ${LANG==='mn'?'is-active':''}" data-lang="mn">MN</button>
  </div>`;
}
function wireLangToggle(container){
  if(!container)return;
  container.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.dataset.lang===LANG)return;
      setLang(btn.dataset.lang);
      if(state.view==='exercise'){
        const topic=TOPICS.find(t=>t.id===state.topicId);
        if(topic){ state.exercise=topic.generate(state.level); state.status=null; }
      }
      render();
    });
  });
}

function renderMenu(){
  const totalSolved=TOPICS.reduce((s,t)=>s+((progress[t.id]&&progress[t.id].correct)||0),0);
  app.innerHTML=`
    <header class="hero">
      <button class="sound-toggle" id="sound-toggle-menu" title="${T('Zapnout/vypnout zvuk','Дуу асаах/унтраах')}"></button>
      ${langToggleHtml('')}
      <div class="hero-illustration" aria-hidden="true">
        <svg class="hero-shape hero-shape-1" viewBox="0 0 24 24" width="70" height="70" fill="none" stroke="#fff" stroke-width="1.3"><circle cx="12" cy="12" r="9"/><path d="M12 12 L12 3 A9 9 0 0 1 19.36 16.5 Z" fill="#fff" fill-opacity=".18" stroke="none"/></svg>
        <svg class="hero-shape hero-shape-2" viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="#fff" stroke-width="1.3"><rect x="3" y="10" width="9" height="9" rx="1.5"/><path d="M17 4 L22 13 L12 13 Z"/></svg>
        <svg class="hero-shape hero-shape-3" viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#fff" stroke-width="1.3"><line x1="6" y1="7" x2="6" y2="15"/><line x1="2" y1="11" x2="10" y2="11"/><line x1="15" y1="15" x2="23" y2="15"/></svg>
        <svg class="hero-shape hero-shape-4" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="1.3"><path d="M12 3a5 5 0 0 0-3 9c.6.5 1 1.2 1 2v1h4v-1c0-.8.4-1.5 1-2a5 5 0 0 0-3-9Z"/></svg>
      </div>
      <div class="hero-content">
        <p class="eyebrow">${T('Příprava na gymnázium · 5. ročník','Гимназийн бэлтгэл · 5-р анги')}</p>
        <h1 class="hero-title">${T('Přijímačky','Элсэлтийн шалгалт')} <span class="hero-title-accent">${T('krok za krokem','алхам алхмаар')}</span></h1>
        <p class="hero-sub">${T('Vyber si téma a procvičuj tolik příkladů, kolik chceš. Každá úloha je nová.','Сэдвээ сонгоод хүссэн хэмжээгээрээ дасгал хийгээрэй. Даалгал бүр шинэ.')}</p>
        <div class="hero-stat"><span class="hero-stat-number">${totalSolved}</span><span class="hero-stat-label">${T('vyřešených příkladů celkem','нийт бодсон бодлого')}</span></div>
      </div>
    </header>
    <div class="tabs">
      <button type="button" class="tab ${state.tab==='practice'?'is-active':''}" data-tab="practice">${T('Procvičování','Дасгал')}</button>
      <button type="button" class="tab ${state.tab==='lessons'?'is-active':''}" data-tab="lessons">${T('Výuka – jak na to','Хичээл – яаж бодох вэ')}</button>
    </div>
    <main id="topic-sections"></main>
    ${totalSolved>0?`<button class="reset-link" id="reset-btn">${T('Vymazat můj pokrok','Миний ахицыг арилгах')}</button>`:''}
  `;
  const host=document.getElementById('topic-sections');
  const grids={};
  const lessonsTab=state.tab==='lessons';
  if(lessonsTab) buildLessonCards(host);
  (lessonsTab?[]:SECTIONS).forEach(sec=>{
    const wrap=document.createElement('section'); wrap.className='topic-section';
    wrap.innerHTML=`<h2 class="section-title">${sec.title[LANG]}</h2><p class="section-sub">${sec.sub[LANG]}</p>`;
    const g=document.createElement('div'); g.className='topic-grid'; wrap.appendChild(g); host.appendChild(wrap); grids[sec.id]=g;
  });
  (lessonsTab?[]:TOPICS).forEach((topic,idx)=>{
    const stats=progress[topic.id];
    const accuracy = stats && stats.total>0 ? Math.round((stats.correct/stats.total)*100) : null;
    const [a,b]=ACCENTS[idx%ACCENTS.length];
    const r=15, c=2*Math.PI*r;
    const offset = accuracy!==null ? c*(1-accuracy/100) : c;
    const card=document.createElement('button');
    card.className='topic-card';
    card.style.setProperty('--accent-a',a);
    card.style.setProperty('--accent-b',b);
    card.style.animationDelay=(idx*0.04)+'s';
    const gradeLabel = typeof topic.grade==='number' ? T(`${topic.grade}. ročník`,`${topic.grade}-р анги`) : topic.grade==='Gym' ? T('Přijímačky','Шалгалт') : topic.grade==='CJ' ? T('Čeština','Чех хэл') : topic.grade==='CM' ? T('CERMAT','CERMAT') : T('Bonus','Урамшуулал');
    card.innerHTML=`
      <div class="topic-card-top">
        <span class="topic-card-icon">${iconSvg(topic.id)}</span>
        <span class="topic-card-grade">${gradeLabel}</span>
      </div>
      <h3 class="topic-card-title">${topic.title[LANG]}</h3>
      <p class="topic-card-desc">${topic.description[LANG]}</p>
      <div class="topic-card-footer">
        ${accuracy!==null
          ? `<span class="ring-wrap">
               <svg width="34" height="34" viewBox="0 0 34 34">
                 <circle class="ring-track" cx="17" cy="17" r="${r}" fill="none" stroke-width="4"/>
                 <circle class="ring-fill" cx="17" cy="17" r="${r}" fill="none" stroke-width="4" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
               </svg>
               <span class="ring-label">${accuracy}%</span>
             </span>
             <span class="topic-card-progress-text">${stats.correct}/${stats.total} ${T('správně','зөв')}</span>`
          : `<span class="topic-card-progress-text topic-card-progress-empty">${T('Zatím nezkoušeno','Одоохондоо оролдоогүй')}</span>`}
      </div>`;
    card.addEventListener('click',()=>{
      if(TEST_DEFS[topic.id]){ navigate(()=>{ state.view='testintro'; state.topicId=topic.id; }); return; }
      navigate(()=>{
        state.view='exercise'; state.topicId=topic.id; state.level=2;
        state.exercise=topic.generate(2); state.status=null;
      });
    });
    grids[topic.section||'math'].appendChild(card);
  });
  const resetBtn=document.getElementById('reset-btn');
  if(resetBtn) resetBtn.addEventListener('click',()=>{progress={}; saveProgress(progress); render();});
  wireSoundToggle(document.getElementById('sound-toggle-menu'));
  wireLangToggle(app.querySelector('.lang-toggle'));
  app.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ if(state.tab===b.dataset.tab)return; navigate(()=>{state.tab=b.dataset.tab;},{scroll:false,duration:120}); }));
}

function wireSoundToggle(btn){
  if(!btn)return;
  const paint=()=>{ btn.textContent = isSoundOn() ? '🔊' : '🔇'; };
  paint();
  btn.addEventListener('click',()=>{
    setSoundOn(!isSoundOn());
    paint();
    document.querySelectorAll('.sound-toggle,.sound-toggle-exercise').forEach(b=>{ b.textContent = isSoundOn() ? '🔊' : '🔇'; });
  });
}

function escAttr(x){return String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function renderExercise(){
  const topic=TOPICS.find(t=>t.id===state.topicId);
  const stats=progress[topic.id]||{streak:0};
  const ex=state.exercise;
  const textChoices = !!(ex.choices && ex.choices.some(c=>String(c).length>6));
  app.innerHTML=`
    <div class="exercise-shell">
      <div class="exercise-page">
        <div class="confetti-layer" id="confetti-layer"></div>
        <div class="exercise-topbar">
          <button class="back-link" id="back-btn">${T('← Zpět na témata','← Сэдвүүд рүү буцах')}</button>
          <div class="topbar-right">
            ${langToggleHtml('lang-toggle-exercise')}
            <button class="sound-toggle sound-toggle-exercise" id="sound-toggle-exercise" title="${T('Zapnout/vypnout zvuk','Дуу асаах/унтраах')}"></button>
            <span class="mascot-wrap" id="mascot">${mascotSvg('neutral')}</span>
            <div class="streak-badge">🔥 ${stats.streak}</div>
          </div>
        </div>
        <p class="exercise-topic-label"><span class="exercise-topic-icon" style="background:linear-gradient(135deg,${ACCENTS[TOPICS.findIndex(t=>t.id===topic.id)%ACCENTS.length][0]},${ACCENTS[TOPICS.findIndex(t=>t.id===topic.id)%ACCENTS.length][1]})">${iconSvg(topic.id)}</span>${topic.title[LANG]}</p>
        <div class="level-row">
          ${LEVELS.map(l=>`<button type="button" class="level-btn ${state.level===l.id?'is-active':''}" data-level="${l.id}">${l.label[LANG]}</button>`).join('')}
        </div>
        <form class="exercise-form" id="exercise-form">
          <p class="exercise-question">${ex.question}</p>
          ${ex.choices
            ? `<div class="choice-row${textChoices?' is-text':''}">${ex.choices.map(c=>`<button type="button" class="choice-btn" data-choice="${escAttr(c)}">${escAttr(c)}</button>`).join('')}</div>`
            : `<input class="exercise-input" type="text" inputmode="${/^-?\d+([.,]\d+)?$/.test(ex.answer)?'decimal':'text'}" placeholder="${T('Tvoje odpověď','Чиний хариулт')}" id="answer-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
               <button type="button" class="check-btn" id="check-btn">${T('Zkontrolovat','Шалгах')}</button>`}
        </form>
        <div id="feedback-zone"></div>
      </div>
    </div>
  `;
  document.getElementById('back-btn').addEventListener('click',()=>{navigate(()=>{state.view='menu';});});
  wireSoundToggle(document.getElementById('sound-toggle-exercise'));
  wireLangToggle(app.querySelector('.lang-toggle-exercise'));
  document.querySelectorAll('.level-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const lvl=Number(btn.dataset.level);
      if(lvl===state.level)return;
      navigate(()=>{
        state.level=lvl;
        state.exercise=topic.generate(lvl);
        state.status=null;
      }, {scroll:false, duration:130});
    });
  });

  if(ex.choices){
    document.querySelectorAll('.choice-btn').forEach(btn=>{
      btn.addEventListener('click',()=>submitAnswer(btn.dataset.choice, btn));
    });
  } else {
    const form=document.getElementById('exercise-form');
    const input=document.getElementById('answer-input');
    const checkBtn=document.getElementById('check-btn');
    form.addEventListener('submit',e=>e.preventDefault());
    function tryCheck(){
      if(!input.value.trim())return;
      submitAnswer(input.value);
    }
    checkBtn.addEventListener('click',tryCheck);
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault(); tryCheck(); }
    });
    input.focus();
  }
}

function submitAnswer(userAnswer, btnEl){
  const topic=TOPICS.find(t=>t.id===state.topicId);
  const ex=state.exercise;
  const correct=checkAnswer(ex,userAnswer);
  recordAttempt(topic.id,correct);

  if(btnEl){
    document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
    btnEl.classList.add(correct?'is-correct':'is-wrong');
    if(!correct) document.querySelectorAll('.choice-btn').forEach(b=>{ if(checkAnswer(ex,b.dataset.choice)) b.classList.add('is-correct'); });
  } else {
    const input=document.getElementById('answer-input');
    input.disabled=true;
    input.classList.add(correct?'is-correct':'is-wrong');
    document.getElementById('check-btn').remove();
  }

  const stats=progress[topic.id];
  const milestone = correct && stats.streak>0 && stats.streak%5===0;

  if(correct){ milestone ? playStreakSound() : playCorrectSound(); } else { playWrongSound(); }
  const mascotEl=document.getElementById('mascot');
  if(mascotEl){
    mascotEl.innerHTML=mascotSvg(correct?'happy':'sad');
    mascotEl.classList.remove('mascot-happy','mascot-sad');
    void mascotEl.offsetWidth;
    mascotEl.classList.add(correct?'mascot-happy':'mascot-sad');
  }

  if(correct){
    const layer=document.getElementById('confetti-layer');
    if(layer) burstConfetti(layer, milestone);
  }
  if(milestone) showMilestoneToast(stats.streak);

  const zone=document.getElementById('feedback-zone');
  zone.innerHTML=`
    <div class="feedback-card ${correct?'feedback-correct':'feedback-wrong'}">
      <span class="feedback-stamp"><span class="feedback-icon">${correct?'✓':'✕'}</span>${correct?T('Správně!','Зөв!'):T('Zkus příště líp','Дараагийн удаа чадна!')}</span>
      <p class="feedback-explanation">${ex.explanation}</p>
      <button class="next-btn" id="next-btn">${T('Další příklad →','Дараагийн бодлого →')}</button>
    </div>
  `;
  document.getElementById('next-btn').addEventListener('click',()=>{
    navigate(()=>{
      state.exercise=topic.generate(state.level);
      state.status=null;
    }, {scroll:false, duration:130});
  });
}

function showMilestoneToast(streak){
  const el=document.createElement('div');
  el.className='milestone-toast';
  el.textContent=T(`🎉 ${streak} v řadě! Skvělá práce!`,`🎉 ${streak} дараалан зөв! Гоё байна!`);
  document.body.appendChild(el);
  setTimeout(()=>{
    el.classList.add('is-leaving');
    setTimeout(()=>el.remove(), 320);
  }, 1800);
}

render();
</script>
